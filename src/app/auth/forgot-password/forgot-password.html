<div class="forgot-password-container">
  <div class="forgot-password-card">
    <!-- 标题 -->
    <div class="header">
      <button class="btn-back" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h2>重置密码</h2>
      <p class="subtitle">{{ currentStep === 1 ? '请输入您的账号信息' : '请输入验证码和新密码' }}</p>
    </div>

    <!-- 全局消息提示 -->
    <div *ngIf="errorMessage.show" 
         class="message-box"
         [class.error]="errorMessage.type === 'error'"
         [class.success]="errorMessage.type === 'success'">
      {{ errorMessage.message }}
    </div>

    <!-- 步骤1：输入账号 -->
    <div *ngIf="currentStep === 1">
      <!-- 重置方式选择 -->
      <div class="reset-type-selector">
        <button 
          class="type-btn"
          [class.active]="resetForm.resetType === 'phone'"
          (click)="switchResetType('phone')">
          📱 手机号
        </button>
        <button 
          class="type-btn"
          [class.active]="resetForm.resetType === 'email'"
          (click)="switchResetType('email')">
          📧 邮箱
        </button>
      </div>

      <!-- 账号输入 -->
      <div class="form-group">
        <label>{{ resetForm.resetType === 'phone' ? '手机号' : '邮箱地址' }}</label>
        <input
          type="text"
          [(ngModel)]="resetForm.account"
          [placeholder]="resetForm.resetType === 'phone' ? '请输入手机号' : '请输入邮箱地址'"
          (blur)="validateAccount()"
          [class.error]="errors.account">
        <span class="error-message" *ngIf="errors.account">{{ errors.account }}</span>
      </div>

      <!-- 下一步按钮 -->
      <button 
        class="btn-submit"
        [disabled]="isSendingCode"
        (click)="sendResetRequest()">
        <span *ngIf="!isSendingCode">{{ resetForm.resetType === 'phone' ? '发送验证码' : '发送重置邮件' }}</span>
        <span *ngIf="isSendingCode">⏳ 发送中...</span>
      </button>
    </div>

    <!-- 步骤2：输入验证码和新密码（仅手机号） -->
    <div *ngIf="currentStep === 2 && resetForm.resetType === 'phone'">
      <!-- 验证码输入 -->
      <div class="form-group">
        <label>验证码</label>
        <div class="code-input-group">
          <input
            type="text"
            [(ngModel)]="resetForm.verificationCode"
            placeholder="请输入6位验证码"
            maxlength="6"
            [class.error]="errors.verificationCode">
          <button 
            class="btn-resend"
            [disabled]="countdown > 0"
            (click)="resendCode()">
            {{ countdown > 0 ? countdown + 's' : '重新发送' }}
          </button>
        </div>
        <span class="error-message" *ngIf="errors.verificationCode">{{ errors.verificationCode }}</span>
      </div>

      <!-- 新密码输入 -->
      <div class="form-group">
        <label>新密码</label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="resetForm.newPassword"
            placeholder="请输入新密码（至少6位）"
            (blur)="validateNewPassword()"
            [class.error]="errors.newPassword">
          <button 
            type="button" 
            class="toggle-password"
            (click)="showPassword = !showPassword">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
        <span class="error-message" *ngIf="errors.newPassword">{{ errors.newPassword }}</span>
      </div>

      <!-- 确认密码输入 -->
      <div class="form-group">
        <label>确认新密码</label>
        <div class="password-input-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="resetForm.confirmPassword"
            placeholder="请再次输入新密码"
            (blur)="validateConfirmPassword()"
            [class.error]="errors.confirmPassword">
          <button 
            type="button" 
            class="toggle-password"
            (click)="showConfirmPassword = !showConfirmPassword">
            <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
        <span class="error-message" *ngIf="errors.confirmPassword">{{ errors.confirmPassword }}</span>
      </div>

      <!-- 提交按钮 -->
      <button 
        class="btn-submit"
        [disabled]="isLoading"
        (click)="submitReset()">
        <span *ngIf="!isLoading">确认重置</span>
        <span *ngIf="isLoading">⏳ 重置中...</span>
      </button>
    </div>

    <!-- 返回登录 -->
    <div class="footer">
      <p>想起密码了？ <a routerLink="/auth/login">返回登录</a></p>
    </div>
  </div>
</div>
